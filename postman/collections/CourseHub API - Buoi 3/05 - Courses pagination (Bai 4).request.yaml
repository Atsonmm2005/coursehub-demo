$kind: http-request
url: "{{base_url}}/courses?skip=0&limit=2"
method: GET
queryParams:
  skip: "0"
  limit: "2"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code la 200", () => {
          pm.response.to.have.status(200);
      });
      pm.test("Dung so luong limit 2", () => {
          const data = pm.response.json();
          pm.expect(data.length).to.eql(2);
      });
    language: text/javascript
order: 6000
