$kind: http-request
url: "{{base_url}}/sections?available_only=true"
method: GET
queryParams:
  available_only: "true"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code la 200", () => {
          pm.response.to.have.status(200);
      });
      pm.test("Cac lop tra ve deu con cho", () => {
          const data = pm.response.json();
          data.forEach(s => pm.expect(s.remaining).to.be.above(0));
      });
    language: text/javascript
order: 11000
