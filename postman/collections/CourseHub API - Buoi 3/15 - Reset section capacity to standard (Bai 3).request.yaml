$kind: http-request
url: "{{base_url}}/sections/WEB-01/capacity"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "capacity": 3
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code la 200", () => {
          pm.response.to.have.status(200);
      });
      pm.test("Khoi phuc suc chua ve 3", () => {
          pm.expect(pm.response.json().new_capacity).to.eql(3);
      });
    language: text/javascript
order: 16000
