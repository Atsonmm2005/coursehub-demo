$kind: http-request
url: "{{base_url}}/sections"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code la 200", () => {
          pm.response.to.have.status(200);
      });
      pm.test("Co 4 lop hoc phan", () => {
          const data = pm.response.json();
          pm.expect(data.length).to.eql(4);
      });
    language: text/javascript
order: 10000
