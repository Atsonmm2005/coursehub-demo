$kind: http-request
url: "{{base_url}}/lecturers"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code la 200", () => {
          pm.response.to.have.status(200);
      });
      pm.test("Chua GV01 va GV02", () => {
          const data = pm.response.json();
          pm.expect(data.some(l => l.id === "GV01")).to.be.true;
          pm.expect(data.some(l => l.id === "GV02")).to.be.true;
      });
    language: text/javascript
order: 9000
