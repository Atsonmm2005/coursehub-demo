$kind: http-request
url: "{{base_url}}/courses/INT2204"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code la 200", () => {
          pm.response.to.have.status(200);
      });
      pm.test("Dung thong tin INT2204", () => {
          const data = pm.response.json();
          pm.expect(data.code).to.eql("INT2204");
          pm.expect(data.credits).to.eql(3);
      });
    language: text/javascript
order: 7000
