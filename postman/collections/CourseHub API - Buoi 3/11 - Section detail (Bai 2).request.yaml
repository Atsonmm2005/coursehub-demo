$kind: http-request
url: "{{base_url}}/sections/WEB-01"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code la 200", () => {
          pm.response.to.have.status(200);
      });
      pm.test("Dung thong tin WEB-01", () => {
          const data = pm.response.json();
          pm.expect(data.section_id).to.eql("WEB-01");
          pm.expect(data.course_id).to.eql("INT2204");
          pm.expect(data.capacity).to.eql(3);
          pm.expect(data.enrolled).to.eql(2);
          pm.expect(data.remaining).to.eql(1);
      });
    language: text/javascript
order: 12000
